collections:
  projects:
    output: true
    permalink: /:collection/:name/

name: Zac Baston

description: Building
avatar: /images/avatar.jpg


footer-links:
  resume: /downloads/ZacBaston-Resume.pdf
  email: zbaston@gmail.com
  github: zacscodingclub
  linkedin: zac-baston
  rss: true

google_analytics: G-2BZRS8TW11

url: https://zacbaston.com

baseurl: ""

#
# !! You don't need to change any of the configuration flags below !!
#

markdown: kramdown
highlighter: rouge
permalink: /:title/

# The release of Jekyll Now that you're using
version: v1.1.0

sass:
  style: :compressed

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate

include:
  - _headers

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
  - IMPROVEMENTS.md
  - deploy
  - Dockerfile
  - docker-compose.yml
  - docker-entrypoint.sh

paginate: 5
